name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build gateway-service
        run: |
          cd gateway-service
          ./mvnw clean verify

      - name: Build resident-service
        run: |
          cd resident-service
          ./mvnw clean verify