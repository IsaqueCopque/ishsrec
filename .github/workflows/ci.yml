name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build gateway-service
        run: |
          cd gateway-service
          mvn -B clean verify

      - name: Build resident-service
        run: |
          cd resident-service
          mvn -B clean verify
  
      - name: Build messages-service
        run: |
          cd messages-service
          pip install -r requirements.txt
      